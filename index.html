const F=(n,d)=>`<span class="f"><i>${n}</i><b>${d}</b></span>`,U=q=>`(1 + ${F('r','1,200')})<sup>N</sup>`.replace(/q/,'');

const Q=[
{src:'NC Q1',t:'Algebra',s:'Linear equations',d:'Easy',q:`If ${F('x − 1','3')} = <i>k</i> and <i>k</i> = 3, what is the value of <i>x</i> ?`,m:['2','4','9','10'],a:'D'},
{src:'Calc Q6',t:'Problem Solving & Data Analysis',s:'Unit conversion',d:'Easy',q:`<table class="d" style="margin:0 0 10px"><tr><td>1 decagram = 10 grams</td></tr><tr><td>1,000 milligrams = 1 gram</td></tr></table>A hospital stores one type of medicine in 2-decagram containers. Based on the information given in the box above, how many 1-milligram doses are there in one 2-decagram container?`,m:['0.002','200','2,000','20,000'],a:'D'},
{src:'NC Q4',t:'Algebra',s:'Interpreting linear models',d:'Easy',q:`Kathy is a repair technician for a phone company. Each week, she receives a batch of phones that need repairs. The number of phones that she has left to fix at the end of each day can be estimated with the equation <i>P</i> = 108 − 23<i>d</i>, where <i>P</i> is the number of phones left and <i>d</i> is the number of days she has worked that week. What is the meaning of the value 108 in this equation?`,m:['Kathy will complete the repairs within 108 days.','Kathy starts each week with 108 phones to fix.','Kathy repairs phones at a rate of 108 per hour.','Kathy repairs phones at a rate of 108 per day.'],a:'B'},
{src:'Calc Q26',t:'Problem Solving & Data Analysis',s:'Percentages',d:'Easy',q:`Katarina is a botanist studying the production of pears by two types of pear trees. She noticed that Type A trees produced 20 percent more pears than Type B trees did. Based on Katarina’s observation, if the Type A trees produced 144 pears, how many pears did the Type B trees produce?`,m:['115','120','124','173'],a:'B'},
{src:'NC Q10',t:'Advanced Math',s:'Function evaluation',d:'Easy',q:`<i>g</i>(<i>x</i>) = <i>ax</i><sup>2</sup> + 24<br>For the function <i>g</i> defined above, <i>a</i> is a constant and <i>g</i>(4) = 8. What is the value of <i>g</i>(−4) ?`,m:['8','0','−1','−8'],a:'A'},
{src:'Calc Q19',t:'Algebra',s:'Linear systems (word problem)',d:'Medium',q:`A food truck sells salads for $6.50 each and drinks for $2.00 each. The food truck’s revenue from selling a total of 209 salads and drinks in one day was $836.50. How many salads were sold that day?`,m:['77','93','99','105'],a:'B'},
{src:'Calc Q13',t:'Problem Solving & Data Analysis',s:'Two-way tables / percent',d:'Medium',q:`A group of tenth-grade students responded to a survey that asked which math course they were currently enrolled in. The survey data were broken down as shown in the table below. Which of the following categories accounts for approximately 19 percent of all the survey respondents?`+tbl(['','Algebra I','Geometry','Algebra II','Total'],[['Female',35,53,62,150],['Male',44,59,57,160],['Total',79,112,119,310]]),m:['Females taking Geometry','Females taking Algebra II','Males taking Geometry','Males taking Algebra I'],a:'C'},
{src:'NC Q9',t:'Algebra',s:'Systems of linear equations',d:'Medium',q:`3<i>x</i> + 4<i>y</i> = −23<br>2<i>y</i> − <i>x</i> = −19<br>What is the solution (<i>x</i>, <i>y</i>) to the system of equations above?`,m:['(−5, −2)','(3, −8)','(4, −6)','(9, −6)'],a:'B'},
{src:'Calc Q11',t:'Algebra',s:'Linear inequalities',d:'Medium',q:`Which of the following numbers is NOT a solution of the inequality 3<i>x</i> − 5 ≥ 4<i>x</i> − 3 ?`,m:['−1','−2','−3','−5'],a:'A'},
{src:'NC Q19',t:'Geometry & Trigonometry',s:'Trigonometry (complementary angles)',d:'Medium',q:`In a right triangle, one angle measures <i>x</i>°, where sin <i>x</i>° = ${F(4,5)}. What is cos(90° − <i>x</i>°) ?`,g:[.8],a:'4/5 or 0.8'},
{src:'Calc Q30',t:'Advanced Math',s:'Quadratics (vertex form)',d:'Medium',q:`Which of the following is an equivalent form of the equation of the graph shown in the <i>xy</i>-plane below, from which the coordinates of vertex <i>A</i> can be identified as constants in the equation?<div>${para}</div>`,m:['<i>y</i> = (<i>x</i> + 3)(<i>x</i> − 5)','<i>y</i> = (<i>x</i> − 3)(<i>x</i> + 5)','<i>y</i> = <i>x</i>(<i>x</i> − 2) − 15','<i>y</i> = (<i>x</i> − 1)<sup>2</sup> − 16'],a:'D'},
{src:'Calc Q14',t:'Problem Solving & Data Analysis',s:'Statistics (mean/median/range, outliers)',d:'Medium',q:`The table below lists the lengths, to the nearest inch, of a random sample of 21 brown bullhead fish. The outlier measurement of 24 inches is an error. Of the mean, median, and range of the values listed, which will change the most if the 24-inch measurement is removed from the data?`+tbl(['Lengths of Fish (in inches)','','','','','',''],[[8,9,9,9,10,10,11],[11,12,12,12,12,13,13],[13,14,14,15,15,16,24]]),m:['Mean','Median','Range','They will all change by the same amount.'],a:'C'},
{src:'NC Q14',t:'Advanced Math',s:'Exponent rules',d:'Medium',q:`If 3<i>x</i> − <i>y</i> = 12, what is the value of ${F(sup(8,'<i>x</i>'),sup(2,'<i>y</i>'))} ?`,m:[sup(2,12),sup(4,4),sup(8,2),'The value cannot be determined from the information given.'],a:'A'},
{src:'Calc Q35',t:'Geometry & Trigonometry',s:'Volume of a cylinder',d:'Medium',q:`<div>${cyl}</div>A dairy farmer uses a storage silo that is in the shape of the right circular cylinder above. If the volume of the silo is 72π cubic yards, what is the <u>diameter</u> of the base of the cylinder, in yards?`,g:[6],a:'6'},
{src:'Calc Q24',t:'Geometry & Trigonometry',s:'Circles in the coordinate plane',d:'Medium',q:`Which of the following is an equation of a circle in the <i>xy</i>-plane with center (0, 4) and a radius with endpoint (${F(4,3)}, 5) ?`,m:[`<i>x</i><sup>2</sup> + (<i>y</i> − 4)<sup>2</sup> = ${F(25,9)}`,`<i>x</i><sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = ${F(25,9)}`,`<i>x</i><sup>2</sup> + (<i>y</i> − 4)<sup>2</sup> = ${F(5,3)}`,`<i>x</i><sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = ${F(3,5)}`],a:'A'},
{src:'NC Q13',t:'Advanced Math',s:'Rational expressions',d:'Hard',q:`If <i>x</i> &gt; 3, which of the following is equivalent to ${F(1,`${F(1,'<i>x</i> + 2')} + ${F(1,'<i>x</i> + 3')}`)} ?`,m:[F('2<i>x</i> + 5','<i>x</i><sup>2</sup> + 5<i>x</i> + 6'),F('<i>x</i><sup>2</sup> + 5<i>x</i> + 6','2<i>x</i> + 5'),'2<i>x</i> + 5','<i>x</i><sup>2</sup> + 5<i>x</i> + 6'],a:'B'},
{src:'Calc Q21',t:'Problem Solving & Data Analysis',s:'Conditional probability (table)',d:'Medium',q:`The data in the table below were produced by a sleep researcher studying the number of dreams people recall when asked to record their dreams for one week. Group X consisted of 100 people who observed early bedtimes, and Group Y consisted of 100 people who observed later bedtimes. If a person is chosen at random from those who recalled at least 1 dream, what is the probability that the person belonged to Group Y ?`+tbl(['Dreams Recalled','None','1 to 4','5 or more','Total'],[['Group X',15,28,57,100],['Group Y',21,11,68,100],['Total',36,39,125,200]]),m:[F(68,100),F(79,100),F(79,164),F(164,200)],a:'C'},
{src:'NC Q7',t:'Advanced Math',s:'Rearranging formulas',d:'Hard',q:`<i>m</i> = ${F(N7,D7)} <i>P</i><br>The formula above gives the monthly payment <i>m</i> needed to pay off a loan of <i>P</i> dollars at <i>r</i> percent annual interest over <i>N</i> months. Which of the following gives <i>P</i> in terms of <i>m</i>, <i>r</i>, and <i>N</i> ?`,m:[`<i>P</i> = ${F(N7,D7)} <i>m</i>`,`<i>P</i> = ${F(D7,N7)} <i>m</i>`,`<i>P</i> = ${R} <i>m</i>`,`<i>P</i> = ${F('1,200','r')} <i>m</i>`],a:'B'},
{src:'Calc Q18',t:'Algebra',s:'Systems of inequalities',d:'Hard',q:`<i>y</i> &lt; −<i>x</i> + <i>a</i><br><i>y</i> &gt; <i>x</i> + <i>b</i><br>In the <i>xy</i>-plane, if (0, 0) is a solution to the system of inequalities above, which of the following relationships between <i>a</i> and <i>b</i> must be true?`,m:['<i>a</i> &gt; <i>b</i>','<i>b</i> &gt; <i>a</i>','|<i>a</i>| &gt; |<i>b</i>|','<i>a</i> = −<i>b</i>'],a:'A'},
{src:'Calc Q32',t:'Algebra',s:'Inequalities in context',d:'Medium',q:`The posted weight limit for a covered wooden bridge in Pennsylvania is 6000 pounds. A delivery truck that is carrying <i>x</i> identical boxes each weighing 14 pounds will pass over the bridge. If the combined weight of the empty delivery truck and its driver is 4500 pounds, what is the maximum possible value for <i>x</i> that will keep the combined weight of the truck, driver, and boxes below the bridge’s posted weight limit?`,g:[107],a:'107'},
{src:'NC Q15',t:'Advanced Math',s:'Polynomial identities / factoring',d:'Hard',q:`If (<i>ax</i> + 2)(<i>bx</i> + 7) = 15<i>x</i><sup>2</sup> + <i>cx</i> + 14 for all values of <i>x</i>, and <i>a</i> + <i>b</i> = 8, what are the two possible values for <i>c</i> ?`,m:['3 and 5','6 and 35','10 and 21','31 and 41'],a:'D'},
{src:'Calc Q38',t:'Advanced Math',s:'Exponential growth (compound interest)',d:'Hard',q:`Jessica opened a bank account that earns 2 percent interest compounded annually. Her initial deposit was $100, and she uses the expression $100(<i>x</i>)<sup><i>t</i></sup> to find the value of the account after <i>t</i> years.<br><br>Jessica’s friend Tyshaun found an account that earns 2.5 percent interest compounded annually. Tyshaun made an initial deposit of $100 into this account at the same time Jessica made a deposit of $100 into her account. After 10 years, how much more money will Tyshaun’s initial deposit have earned than Jessica’s initial deposit? (Round your answer to the nearest cent and ignore the dollar sign when gridding your response.)`,g:[6.11],tol:.005,a:'6.11'}

const L='ABCD',$=s=>document.querySelector(s),app=$('#app'),N=Q.length;
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=ls.get('sat_draft',{name:'',id:'',cls:'',ans:{},cur:0,start:0}),subs=ls.get('sat_subs',[]),view='home',tab='ov',selQ=0,selS='',sortBy='time',last=null,dbm=null,dbOk=false;
const num=s=>{s=String(s).trim().replace(/\s/g,'');if(/^-?\d*\.?\d+$/.test(s))return +s;const m=s.match(/^(-?\d+)\/(\d+)$/);return m&&+m[2]?m[1]/m[2]:NaN};
function grade(q,a){if(!a)return'u';if(q.m)return a===q.a?'c':'w';const v=num(a);return !isNaN(v)&&q.g.some(g=>Math.abs(g-v)<=(q.tol||.0011))?'c':'w'}
const res=s=>Q.map((q,i)=>grade(q,s.a[i]));
const score=s=>res(s).filter(x=>x==='c').length;
const save=()=>ls.set('sat_draft',S);
/* ---------- STUDENT ---------- */
function home(){view='home';app.className='';app.innerHTML=`<h1>SAT Math Practice Test</h1><p class="mu">${N} questions · select one answer per question · you can go back and change answers before submitting.</p>
<div class="card"><label class="l" for="nm">Student name *</label><input type="text" id="cl" value="${esc(S.cls)}">
<p id="e" class="err"></p><button class="p" id="go">${Object.keys(S.ans).length?'Resume test':'Start test'}</button></div>
<p class="mu">Scratch paper is allowed. Calculator rules are set by your teacher. Do not leave or refresh the page during the test—your answers are saved automatically on this device.</p>
<p class="mu"><a href="#" id="tl">Teacher login</a></p>`;
$('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n){$('#e').textContent='Please enter your name to begin.';return}S.name=n;S.id=$('#sid').value.trim();S.cls=$('#cl').value.trim();if(!S.start)S.start=Date.now();save();test()};
$('#tl').onclick=async e=>{e.preventDefault();let ok=false;try{const u=await claude.use('user');ok=u&&u.isOwner()}catch(x){}
if(!ok){const p=prompt('Teacher passcode:');ok=p==='SAT22'}if(ok){await initDb();teacher()}else if(ok===false)alert('Incorrect passcode.')}}
function test(){view='test';app.className='';const i=S.cur,q=Q[i],a=S.ans[i]||'',done=Object.keys(S.ans).filter(k=>S.ans[k]).length;
app.innerHTML=`<div class="mu" style="display:flex;justify-content:space-between"><span>${esc(S.name)}</span><span>${done} of ${N} answered</span></div><div class="bar"><i style="width:${done/N*100}%"></i></div>
<h2>Question ${i+1} <span class="mu">of ${N}</span></h2><div class="qt">${q.q}</div>
<div role="radiogroup" aria-label="Answer choices">${q.m?q.m.map((c,k)=>`<label class="ch ${a===L[k]?'s':''}"><input type="radio" name="a" value="${L[k]}" ${a===L[k]?'checked':''}><b>${L[k]}</b><span>${c}</span></label>`).join(''):`<label class="l" for="gi">Your answer (a whole number, decimal, or fraction like 3/4)</label><input type="text" id="gi" inputmode="decimal" value="${esc(a)}" style="max-width:240px;font-size:20px" autocomplete="off">`}</div>
${q.m&&a?'<button id="clr" class="mu" style="margin-top:6px">Clear answer</button>':''}
<div class="nav"><button id="pv" ${i?'':'disabled'}>← Previous</button>${i<N-1?'<button class="p" id="nx">Next →</button>':'<button class="p" id="rv">Review &amp; submit</button>'}</div>
<h2 style="font-size:15px">Jump to question</h2><div class="dots">${Q.map((_,k)=>`<button data-k="${k}" class="${S.ans[k]?'a':''} ${k===i?'c':''}" aria-label="Question ${k+1}${S.ans[k]?' answered':''}">${k+1}</button>`).join('')}</div><button id="rv2">Review &amp; submit</button>`;
document.querySelectorAll('input[name=a]').forEach(r=>r.onchange=()=>{S.ans[i]=r.value;save();test()});
const gi=$('#gi');if(gi)gi.oninput=()=>{S.ans[i]=gi.value.trim();if(!S.ans[i])delete S.ans[i];save();document.querySelectorAll('.dots button')[i].className='c '+(S.ans[i]?'a':'')};
if($('#clr'))$('#clr').onclick=()=>{delete S.ans[i];save();test()};
$('#pv').onclick=()=>{S.cur--;save();test();scrollTo(0,0)};if($('#nx'))$('#nx').onclick=()=>{S.cur++;save();test();scrollTo(0,0)};
['#rv','#rv2'].forEach(x=>{if($(x))$(x).onclick=review});document.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.k;save();test();scrollTo(0,0)})}
function review(){const un=Q.map((_,i)=>i).filter(i=>!S.ans[i]);app.innerHTML=`<h1>Review &amp; submit</h1><p>You have answered <b>${N-un.length} of ${N}</b> questions.</p>${un.length?`<p class="err">Unanswered: ${un.map(i=>`<a href="#" data-k="${i}">Q${i+1}</a>`).join(', ')}</p>`:''}<p>Once you submit, you cannot change your answers.</p><button id="bk">← Back to test</button> <button class="p" id="sb">Submit test</button>`;
$('#bk').onclick=test;document.querySelectorAll('a[data-k]').forEach(a=>a.onclick=e=>{e.preventDefault();S.cur=+a.dataset.k;test()});
$('#sb').onclick=()=>{if(!confirm(`You have answered ${N-un.length} of ${N} questions. Are you sure you want to submit?`))return;submit()}}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))),dec=c=>JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
async function submit(){const rec={aid:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),n:S.name,id:S.id,c:S.cls,ts:Date.now(),a:Q.map((_,i)=>S.ans[i]||'')};
last=rec;subs.push(rec);ls.set('sat_subs',subs);S={name:'',id:'',cls:'',ans:{},cur:0,start:0};save();let sent='';
try{const u=await claude.use('user');const db=await claude.use('db');if(db){await db.collection('subs').doc(rec.aid).set({...rec,a:rec.a.join('|')});sent='ok'}}catch(e){}
results(rec,sent)}
function results(r,sent){const rs=res(r),c=rs.filter(x=>x==='c').length,w=rs.filter(x=>x==='w').length,u=rs.filter(x=>x==='u').length;
app.innerHTML=`<h1>Results</h1><p><b>${esc(r.n)}</b></p><div class="card"><div class="stat"><b>${c} / ${N}</b>Raw score</div><div class="stat"><b>${(c/N*100).toFixed(1)}%</b>Accuracy</div><div class="stat"><b>${w}</b>Incorrect</div><div class="stat"><b>${u}</b>Unanswered</div><p class="mu">This is a raw score on a ${N}-question practice set, not an official SAT score.</p></div>
<div class="tw"><table><tr><th>Question</th><th>Your answer</th><th>Correct answer</th><th>Result</th></tr>${Q.map((q,i)=>`<tr class="${rs[i]==='c'?'ok':rs[i]==='w'?'no':'un'}"><td>${i+1}</td><td>${r.a[i]?esc(r.a[i]):'—'}</td><td>${q.a}</td><td>${{c:'Correct',w:'Incorrect',u:'Unanswered'}[rs[i]]}</td></tr>`).join('')}</table></div>
<div class="card"><b>${sent==='ok'?'Your result was sent to your teacher.':'Send your result to your teacher'}</b>${sent==='ok'?'<p class="mu">If your teacher says they did not receive it, use the code below.</p>':'<p class="mu">Copy this code and send it to your teacher (message or email). It contains your answers.</p>'}<textarea id="cd" rows="3" readonly>${enc(r)}</textarea><button id="cp">Copy code</button></div>`;
$('#cd').onclick=e=>e.target.select();$('#cp').onclick=()=>{$('#cd').select();try{navigator.clipboard.writeText($('#cd').value)}catch(e){document.execCommand('copy')}$('#cp').textContent='Copied'};scrollTo(0,0)}
/* ---------- TEACHER ---------- */
async function initDb(){if(dbOk)return;try{dbm=await claude.use('db');if(!dbm)return;dbOk=true;dbm.collection('subs').onSnapshot(s=>{let ch=0;s.docs.forEach(d=>{const x=d.data();if(x&&!subs.some(y=>y.aid===d.id)){subs.push({...x,aid:d.id,a:String(x.a).split('|')});ch=1}});if(ch){ls.set('sat_subs',subs);if(view==='t')teacher()}},()=>{})}catch(e){}}
const pct=(a,b)=>b?(a/b*100):0,fm=x=>x.toFixed(1)+'%',nm=s=>esc(s.n)+(s.id?` <span class="mu">(${esc(s.id)})</span>`:'');
const mark={c:'<td class="ok">✓</td>',w:'<td class="no">✗</td>',u:'<td class="un">—</td>'};
function qstats(){return Q.map((q,i)=>{const g=subs.map(s=>grade(q,s.a[i]));return{i,c:g.filter(x=>x==='c').length,w:g.filter(x=>x==='w').length,u:g.filter(x=>x==='u').length,p:pct(g.filter(x=>x==='c').length,g.length),wrong:subs.filter((s,k)=>g[k]!=='c')}})}
function agg(key){const m={};Q.forEach((q,i)=>{const k=q[key];m[k]=m[k]||{c:0,t:0,n:0};m[k].n++;subs.forEach(s=>{m[k].t++;if(grade(q,s.a[i])==='c')m[k].c++})});return Object.entries(m).sort((a,b)=>pct(a[1].c,a[1].t)-pct(b[1].c,b[1].t))}
const aggT=m=>`<div class="tw"><table><tr><th class="l">Name</th><th>Questions</th><th>Correct</th><th>Accuracy</th></tr>${m.map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v.n}</td><td>${v.c}/${v.t}</td><td><span class="pb" style="width:${pct(v.c,v.t)}px"></span> ${fm(pct(v.c,v.t))}</td></tr>`).join('')}</table></div>`;
function teacher(){view='t';app.className='wide';const tabs=[['ov','Overview'],['st','Students'],['qs','Questions'],['tp','Topics & skills'],['qa','Who missed a question?'],['sa','Student analysis'],['ky','Question key'],['ex','Export / import']];
let b='';const sc=subs.map(score);
if(!subs.length&&tab!=='ex'&&tab!=='ky')b='<div class="card">No submissions yet. Students’ results appear here automatically if live sync is available; otherwise paste their result codes in <b>Export / import</b>.</div>';
else if(tab==='ov'){const so=[...sc].sort((a,b)=>a-b),md=so.length%2?so[(so.length-1)/2]:(so[so.length/2-1]+so[so.length/2])/2,av=sc.reduce((a,b)=>a+b,0)/sc.length,qs=qstats().sort((a,b)=>a.p-b.p).slice(0,5);
b=`<div class="card"><div class="stat"><b>${subs.length}</b>Students</div><div class="stat"><b>${av.toFixed(1)}</b>Average score</div><div class="stat"><b>${Math.max(...sc)}</b>Highest</div><div class="stat"><b>${Math.min(...sc)}</b>Lowest</div><div class="stat"><b>${md}</b>Median</div><div class="stat"><b>${fm(av/N*100)}</b>Avg accuracy</div></div><h2>Hardest questions (lowest class accuracy)</h2><ol>${qs.map(x=>`<li><b>Q${x.i+1}</b> — ${fm(x.p)} correct · ${esc(Q[x.i].s)} <span class="mu">(${Q[x.i].src})</span></li>`).join('')}</ol>`}
else if(tab==='st'){const rows=subs.map((s,k)=>({s,sc:sc[k],r:res(s)}));rows.sort((a,b)=>sortBy==='score'?b.sc-a.sc:sortBy==='name'?a.s.n.localeCompare(b.s.n):a.s.ts-b.s.ts);
b=`<p>Sort: <select id="so" style="width:auto"><option value="time">Submission time</option><option value="score">Score (high→low)</option><option value="name">Name</option></select> &nbsp; ✓ correct · ✗ incorrect · — unanswered</p><div class="tw"><table><tr><th class="l">Student</th>${Q.map((_,i)=>`<th>Q${i+1}</th>`).join('')}<th>Score</th></tr>${rows.map(x=>`<tr><td class="l">${nm(x.s)}</td>${x.r.map(v=>mark[v]).join('')}<td><b>${x.sc}/${N}</b></td></tr>`).join('')}</table></div>`}
else if(tab==='qs'){b=`<div class="tw"><table><tr><th>Test Q</th><th class="l">Original</th><th class="l">Domain</th><th class="l">Skill</th><th>Difficulty*</th><th>✓</th><th>✗</th><th>—</th><th>% correct</th></tr>${qstats().map(x=>`<tr><td>Q${x.i+1}</td><td class="l">${Q[x.i].src}</td><td class="l">${Q[x.i].t}</td><td class="l">${Q[x.i].s}</td><td>${Q[x.i].d}</td><td>${x.c}</td><td>${x.w}</td><td>${x.u}</td><td class="${x.p<50?'no':''}">${fm(x.p)}</td></tr>`).join('')}</table></div><p class="mu">*Difficulty is the teacher’s estimate, not official data. NC = No-Calculator section, Calc = Calculator section of SAT Practice Test #1.</p>`}
else if(tab==='tp'){b=`<h2>By SAT Math domain</h2>${aggT(agg('t'))}<h2>By specific skill</h2>${aggT(agg('s'))}`}
else if(tab==='qa'){const x=qstats()[selQ];b=`<p><select id="sq" style="width:auto">${Q.map((_,i)=>`<option value="${i}" ${i===selQ?'selected':''}>Question ${i+1}</option>`).join('')}</select></p><div class="card"><h2 style="margin-top:0">Question ${selQ+1} — ${fm(x.p)} correct</h2><p>Topic: ${Q[selQ].t} — ${Q[selQ].s}<br>Original source: SAT Practice Test #1, ${Q[selQ].src}<br>Correct answer: <b>${Q[selQ].a}</b></p><b>Students who did not answer correctly (${x.wrong.length}):</b><ul>${x.wrong.map(s=>`<li>${nm(s)} — answered ${s.a[selQ]?esc(s.a[selQ]):'<i>unanswered</i>'}</li>`).join('')||'<li>None</li>'}</ul></div><div class="card"><div class="qt">${Q[selQ].q}</div></div>`}
else if(tab==='sa'){const k=subs.findIndex(s=>s.aid===selS),s=subs[k>=0?k:0];if(s){const r=res(s),c=score(s),perT={};Q.forEach((q,i)=>{const t=q.s;perT[t]=perT[t]||[0,0];perT[t][1]++;if(r[i]==='c')perT[t][0]++});const str=Object.entries(perT).filter(e=>e[1][0]===e[1][1]).map(e=>e[0]),weak=Object.entries(perT).filter(e=>e[1][0]<e[1][1]).map(e=>e[0]);
b=`<p><select id="ss" style="width:auto">${subs.map(x=>`<option value="${x.aid}" ${x===s?'selected':''}>${esc(x.n)}</option>`).join('')}</select></p><div class="card"><h2 style="margin-top:0">${nm(s)} — ${c}/${N} (${fm(c/N*100)})</h2><p><b>Skills answered correctly:</b> ${str.join('; ')||'none'}</p><p><b>Needs improvement (missed ≥1 question):</b> ${weak.join('; ')||'none'}</p></div><div class="tw"><table><tr><th>Q</th><th class="l">Topic</th><th class="l">Skill</th><th>Diff.</th><th>Original</th><th>Student</th><th>Correct</th></tr>${Q.map((q,i)=>r[i]==='c'?'':`<tr class="${r[i]==='w'?'no':'un'}"><td>Q${i+1}</td><td class="l">${q.t}</td><td class="l">${q.s}</td><td>${q.d}</td><td>${q.src}</td><td>${s.a[i]||'Unanswered'}</td><td>${q.a}</td></tr>`).join('')}</table></div>`}}
else if(tab==='ky'){b=`<p class="mu">Answer key as used for grading (verified against the College Board key and re-solved by hand).</p><div class="tw"><table><tr><th>Q</th><th class="l">Original</th><th class="l">Domain</th><th class="l">Skill</th><th>Diff.</th><th>Key</th></tr>${Q.map((q,i)=>`<tr><td>${i+1}</td><td class="l">${q.src}</td><td class="l">${q.t}</td><td class="l">${q.s}</td><td>${q.d}</td><td><b>${q.a}</b></td></tr>`).join('')}</table></div>`}
else if(tab==='ex'){b=`<div class="card"><h2 style="margin-top:0">Import student result codes</h2><p class="mu">Paste one code per line (students get a code on their result screen).</p><textarea id="im" rows="4"></textarea><p><button class="p" id="imb">Import</button> <span id="ims"></span></p></div>
<div class="card"><h2 style="margin-top:0">Export</h2><button id="ecsv">Download CSV</button> <button id="ejs">Download JSON</button> <button onclick="print()">Print</button><p class="mu">Data lives in this browser (localStorage)${dbOk?' and in the shared live store':''}. Export regularly. Clearing browser data erases it.</p></div>
<div class="card"><button id="clr" class="no">Delete all results</button></div>`}
app.innerHTML=`<h1>Teacher dashboard</h1><div class="tabs">${tabs.map(t=>`<button class="t ${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}<button class="t" id="hm">← Student page</button></div>${b}`;
document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{tab=x.dataset.t;teacher()});$('#hm').onclick=home;
const so=$('#so');if(so){so.value=sortBy;so.onchange=()=>{sortBy=so.value;teacher()}}const sq=$('#sq');if(sq)sq.onchange=()=>{selQ=+sq.value;teacher()};const ss=$('#ss');if(ss)ss.onchange=()=>{selS=ss.value;teacher()};
if($('#imb'))$('#imb').onclick=()=>{let n=0,bad=0;$('#im').value.split(/\s+/).filter(Boolean).forEach(c=>{try{const r=dec(c);if(!r.aid||!Array.isArray(r.a))throw 0;if(!subs.some(x=>x.aid===r.aid)){subs.push(r);n++}}catch(e){bad++}});ls.set('sat_subs',subs);$('#ims').textContent=`${n} imported${bad?`, ${bad} invalid`:''}.`;if(n)setTimeout(()=>{tab='st';teacher()},700)};
if($('#clr'))$('#clr').onclick=async()=>{if(!confirm('Permanently delete ALL student results from this browser (and the live store)?'))return;try{if(dbm)for(const s of subs)await dbm.collection('subs').doc(s.aid).delete()}catch(e){}subs=[];ls.set('sat_subs',subs);teacher()};
if($('#ecsv'))$('#ecsv').onclick=()=>dl('sat-results.csv',csv());if($('#ejs'))$('#ejs').onclick=()=>dl('sat-results.json',JSON.stringify({questions:Q.map((q,i)=>({test_q:i+1,original:q.src,domain:q.t,skill:q.s,difficulty_estimate:q.d,key:q.a})),submissions:subs.map(s=>({...s,score:score(s),results:res(s)}))},null,1))}
const cq=v=>'"'+String(v).replace(/"/g,'""')+'"';
function csv(){const h=['Name','ID','Class','Submitted'];Q.forEach((q,i)=>h.push(`Q${i+1} answer (${q.src})`,`Q${i+1} correct`));h.push('Score','Percent');const L2={c:'1',w:'0',u:''};
return [h,...subs.map(s=>{const r=res(s),row=[s.n,s.id,s.c,new Date(s.ts).toISOString()];Q.forEach((q,i)=>row.push(s.a[i]||'',L2[r[i]]));const c=score(s);row.push(c,(c/N*100).toFixed(1));return row})].map(r=>r.map(cq).join(',')).join('\n')}
async function dl(name,data){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){}
const w=document.createElement('textarea');w.value=data;w.rows=10;w.style.marginTop='12px';app.appendChild(w);w.select();alert('Download is unavailable here. The data is shown below—copy it into a file.')}
home();
</script></body></html>
